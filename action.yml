name: "Markdown Link Checker"
description: "Checks all hyperlinks in Markdown files for broken links, fragments and file references, with retries, caching, annotations, a step summary and JSON output"
author: "HarryVasanth"
branding:
  icon: "link"
  color: "blue"
inputs:
  path:
    description: "Path to check for markdown files"
    required: false
    default: "."
  files:
    description: "Specific markdown files to check (comma or space separated)"
    required: false
  exclude:
    description: "Files or directories to exclude (comma or space separated)"
    required: false
  recursive:
    description: "Check files recursively"
    required: false
    default: "true"
  timeout:
    description: "Connect timeout in seconds (the total request time is capped at 2x this value)"
    required: false
    default: "10"
  retry-count:
    description: "Maximum attempts per URL. 0 or 1 means a single attempt. Only 000/408/425/429/5xx are retried"
    required: false
    default: "3"
  verbose:
    description: "Show detailed output"
    required: false
    default: "false"
  quiet:
    description: "Only print broken links and the final summary"
    required: false
    default: "false"
  config-file:
    description: "Path to configuration file"
    required: false
  ignore-urls:
    description: "Comma-separated URL substrings or globs to ignore (e.g., 'localhost,https://*.example.com/*')"
    required: false
  user-agent:
    description: "Custom User-Agent header for HTTP requests to prevent 403 blocks"
    required: false
    default: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36"
outputs:
  json:
    description: 'JSON output of broken links. Example: `[{"link":"https://example.com/broken","file":"README.md","line_num":5,"status":"404"}]`'
  broken_count:
    description: "Number of broken link occurrences found."
  checked_files:
    description: "Number of files scanned."
  total_links:
    description: "Number of links scanned."
runs:
  using: "docker"
  image: "Dockerfile"
