name: "Markdown Link Checker"
description: "Checks all hyperlinks in Markdown files for broken links, fragments, and file references, with retries, caching, and JSON output"
author: "HarryVasanth"
branding:
  icon: "link"
  color: "blue"
inputs:
  path:
    description: "Path to check for markdown files"
    required: false
    default: "."
  files:
    description: "Specific markdown files to check (comma or space separated)"
    required: false
  exclude:
    description: "Files or directories to exclude (comma or space separated)"
    required: false
  recursive:
    description: "Check files recursively"
    required: false
    default: "true"
  timeout:
    description: "Timeout for HTTP requests in seconds (both connect and max-time)"
    required: false
    default: "10"
  retry-count:
    description: "Number of retries for failed requests"
    required: false
    default: "3"
  verbose:
    description: "Show detailed output"
    required: false
    default: "false"
  config-file:
    description: "Path to configuration file"
    required: false
  ignore-urls:
    description: "Comma-separated list of URLs or string patterns to ignore (e.g., 'localhost,example.com')"
    required: false
  user-agent:
    description: "Custom User-Agent header for HTTP requests to prevent 403 blocks"
    required: false
    default: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36"
outputs:
  json:
    description: 'JSON output of broken links. Example: `[{"link":"https://example.com/broken","file":"README.md","line_num":5,"status":"404"}]`'
runs:
  using: "docker"
  image: "Dockerfile"
